<!DOCTYPE html>
<html>
<head>
    <title>DOM XSS Payload Demonstration</title>
    <style>
        body { font-family: Arial; margin: 40px; }
        textarea { width: 100%; height: 80px; }
        button { padding: 8px 12px; margin-top: 10px; }
        .output { margin-top: 20px; padding: 10px; border: 1px solid #ccc; }
        code { background: #f4f4f4; padding: 2px 5px; }
    </style>
</head>
<body>

<h2>DOM XSS Payload Tester (Vulnerable)</h2>

<p>Paste any payload below and click Render:</p>

<textarea id="payload"></textarea><br>
<button onclick="render()">Render</button>

<div class="output" id="output"></div>

<script>
function render() {
    var value = document.getElementById("payload").value;
    document.getElementById("output").innerHTML = value; // Vulnerable sink
}
</script>

</body>
</html>
