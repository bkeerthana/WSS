<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vulnerable DOM XSS Demo</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; }
    .box { border: 1px solid #ccc; padding: 20px; border-radius: 8px; }
    input[type=text] { width: 420px; padding: 8px; }
    button { padding: 8px 12px; }
    .result { margin-top: 20px; padding: 12px; background: #fff4f4; border-left: 4px solid #d33; }
    code { background: #f4f4f4; padding: 2px 6px; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>Vulnerable DOM-Based XSS Example</h1>

  <div class="box">
    <p>This page reads the value from the URL fragment <code>#</code> and inserts it into the page using <code>innerHTML</code>.</p>

    <input type="text" id="userInput" placeholder="Enter text or payload">
    <button onclick="updateHash()">Update</button>

    <div class="result">
      <strong>Preview:</strong>
      <span id="output"></span>
    </div>

    <p><strong>Try:</strong> <code>&lt;img src=x onerror=alert('DOM XSS')&gt;</code></p>
    <p><strong>Direct URL example:</strong></p>
    <code>vulnerable.html#&lt;img src=x onerror=alert('DOM XSS')&gt;</code>

    <p><a href="index.html">Back</a></p>
  </div>

  <script>
    function renderFromHash() {
      const value = decodeURIComponent(location.hash.substring(1));
      document.getElementById("userInput").value = value;
      document.getElementById("output").innerHTML = value; // Vulnerable line
    }

    function updateHash() {
      const value = document.getElementById("userInput").value;
      location.hash = encodeURIComponent(value);
    }

    window.addEventListener("hashchange", renderFromHash);
    window.addEventListener("load", renderFromHash);
  </script>
</body>
</html>
